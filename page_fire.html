<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อุปกรณ์ดับเพลิง</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="page_fire_style.css">
</head>
<body>

    <div id="fireFilterTemplate" style="display: none;">
        <div class="search-container" style="display: flex; gap: 10px;">
            <input type="text" id="globalSearchInput" placeholder="ค้นหาสถานที่ติดตั้ง, หมายเลขถัง..." style="padding: 8px 15px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); color: #fff; width: 250px;">
        </div>
    </div>

    <div class="content-area">
        <div class="gallery-grid" id="fireGallery">
            <div id="assetLoading" class="loading-text">⌛ กำลังเชื่อมต่อฐานข้อมูลอุปกรณ์ดับเพลิง...</div>
        </div>
    </div>

    <div id="vehicleModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-layout-flex">
                <div class="modal-image-container">
                    <img id="modalImage" src="" alt="ภาพขยาย">
                    <button class="slide-btn" id="prevImageBtn" onclick="prevImage()">❮</button>
                    <button class="slide-btn" id="nextImageBtn" onclick="nextImage()">❯</button>
                    <div class="image-counter" id="imageNumber"></div>
                </div>
                <div id="modalDetails"></div>
            </div>
        </div>
    </div>

    <div id="inspectionHistoryModal" class="modal">
        <div id="inspectionModalContent" class="modal-content">
            <div class="modal-close-wrapper" style="display: none;">
                <span class="close" onclick="closeHistoryModal()">&times;</span>
            </div>
            <div class="modal-table-padding" style="padding: 0; background: transparent;">
                <div class="table-scroll-container">
                    <table>
                        <thead id="inspectionChecklistHead"></thead>
                        <tbody id="inspectionChecklistBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="refillHistoryModal" class="modal">
        <div id="refillModalContent" class="modal-content">
            <div class="modal-close-wrapper" style="display: none;">
                <span class="close" onclick="closeRefillModal()">&times;</span>
            </div>
            <div class="modal-table-padding" style="padding: 0; background: transparent;">
                <div class="table-scroll-container">
                    <table>
                        <thead id="refillHistoryHead">
                            <tr style="background-color: #f1f5f9;">
                                <th style="padding: 10px; border: 1px solid #cbd5e1; width: 120px;">วันที่เติม</th>
                                <th style="padding: 10px; border: 1px solid #cbd5e1;">สารเคมี</th>
                                <th style="padding: 10px; border: 1px solid #cbd5e1; width: 110px;">นน.ก่อน (Kg.)</th>
                                <th style="padding: 10px; border: 1px solid #cbd5e1; width: 110px;">นน.หลัง (Kg.)</th>
                                <th style="padding: 10px; border: 1px solid #cbd5e1;">บริษัทที่ดำเนินการ</th>
                            </tr>
                        </thead>
                        <tbody id="refillHistoryBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="page_fire_script.js"></script>
</body>
</html>
