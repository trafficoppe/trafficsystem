<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Dashboard - Official Daily Report</title>
    
    <!-- External Libraries -->
    <link href="https://fonts.cdnfonts.com/css/th-sarabun-new" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { corePlugins: { preflight: false } }</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script>google.charts.load('current', {'packages':['corechart']});</script>

    <!-- เชื่อมไฟล์ CSS ของเรา -->
    <link rel="stylesheet" href="report_daily_style.css">
</head>
<body>

    <div class="dashboard-section" id="containerSection">
        <div class="main-card relative" id="pdfContent">
            
            <button id="exportBtn" onclick="exportToJPEG()" title="บันทึกเป็นภาพ" class="absolute top-6 right-6 w-12 h-12 rounded-full bg-green-500 hover:bg-green-600 text-white flex justify-center items-center transition shadow-md z-50">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            </button>

            <div class="flex justify-center items-center mb-10 relative flex-wrap gap-4" id="controlsContainer">
                <button id="btnPrev" onclick="changeDate(-1)" class="flex-shrink-0 text-slate-400 hover:text-blue-600 flex justify-center items-center transition z-10 transform hover:scale-110 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:text-slate-400 p-2">
                    <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                
                <div id="dateBox" class="relative flex flex-col justify-center items-center bg-slate-50 border-2 border-slate-200 rounded-3xl px-10 py-4 cursor-pointer hover:border-blue-400 transition shadow-sm overflow-hidden group min-w-[380px]">
                    <div id="customDateText" class="font-bold text-[25px] text-slate-700 pointer-events-none whitespace-nowrap text-center leading-normal pb-2 border-b border-gray-200 w-full">
                        รายงานเหตุการณ์ประจำ...
                    </div>
                    <div class="font-bold text-[25px] text-[#0f172a] pointer-events-none whitespace-nowrap text-center leading-normal pt-2">
                        งานจราจรและความปลอดภัย
                    </div>
                    <input type="date" id="dateSelect" onchange="renderAllTables()">
                </div>

                <button id="btnNext" onclick="changeDate(1)" class="flex-shrink-0 text-slate-400 hover:text-blue-600 flex justify-center items-center transition z-10 transform hover:scale-110 disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:text-slate-400 p-2">
                    <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <div id="printHeaderContainer" style="display: none; margin-bottom: 30px;">
                <h1 id="printHeader" class="text-center font-bold text-[25px] text-gray-800 mb-4 leading-tight">
                    รายงานเหตุการณ์ วันที่ ...
                </h1>
                <h2 class="text-center font-bold text-[25px] text-[#0f172a] m-0 leading-tight">
                    งานจราจรและความปลอดภัย
                </h2>
            </div>

            <div class="flex flex-col md:flex-row gap-8 mb-10 items-stretch">
                
                <div class="w-full md:w-[35%] flex flex-col">
                    <!-- 🌟 ลบหัวข้อเหตุการณ์เหนือตารางออกแล้ว 🌟 -->
                    <div class="flex-1"> 
                        <table class="dash-table">
                            <thead>
                                <tr>
                                    <th class="text-center" style="width:75%;">เหตุการณ์</th>
                                    <th class="text-center" style="width:25%;">จำนวน</th>
                                </tr>
                            </thead>
                            <tbody id="incDailyBody"></tbody>
                        </table>
                    </div>
                </div>

                <div class="w-full md:w-[65%] flex flex-col">
                    <!-- 🌟 ลบหัวข้อกราฟแบบเก่าข้างบนออก 🌟 -->
                    
                    <div class="chart-box flex-1 flex flex-col relative"> 
                        <div id="car-summary-cards" class="grid grid-cols-3 gap-4 mb-6"></div>
                        <div class="flex-1 flex flex-col justify-center w-full">
                            <div id="daily_car_chart" style="width: 100%; height: 320px;"></div>
                        </div>
                        
                        <!-- 🌟 ย้ายหัวข้อกราฟมาไว้มุมขวาล่างในกรอบ และปรับสไตล์เป็น 13px ตัวบาง 🌟 -->
                        <div class="text-right mt-2 text-[13px] font-normal text-gray-500">
                            กราฟแสดงข้อมูลจำนวนรถเข้า
                        </div>
                    </div>
                </div>

            </div>

            <hr class="my-10 border-t-2 border-dashed border-gray-300">
            
            <h2 class="text-[20px] font-bold text-center mb-8">รายละเอียดรายงานเหตุการณ์</h2>
            
            <div id="incidentTextDetails"></div>
            
        </div>
    </div>

    <footer class="global-footer" style="background: #ffffff; color: #475569; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; font-size: 15px; margin-top: auto;">
        <div>© 2026 งานจราจรและความปลอดภัย กองกายภาพและสิ่งแวดล้อม มหาวิทยาลัยมหิดล</div>
        <div>โทรศัพท์: 0-2849-6000 |</div>
    </footer>

    <!-- เชื่อมไฟล์ JavaScript ของเรา -->
    <script src="report_daily_script.js"></script>
</body>
</html>
