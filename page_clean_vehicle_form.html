<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกการทำความสะอาดยานพาหนะ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background-color: #f1f5f9;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            font-family: 'Prompt', sans-serif;
        }
        .standalone-form-container {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        .form-header-title {
            text-align: center;
            color: #0ea5e9;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #e2e8f0;
        }
        @media (max-width: 600px) {
            body { padding: 15px; }
            .standalone-form-container { padding: 25px 20px; }
            .form-header-title { font-size: 22px; }
        }
        .swal2-popup.custom-swal-popup { border-radius: 24px !important; background: linear-gradient(145deg, #ffffff, #f8fafc) !important; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(0,0,0,0.05) !important; }
        .swal2-title.custom-swal-title { font-family: 'Prompt', sans-serif !important; color: #0284c7 !important; font-size: 26px !important; font-weight: 600 !important; }
        
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 6px; color: #334155; font-size: 15px; }
        .form-group input[type="text"], .form-group input[type="date"], .form-group textarea { width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; font-family: 'Prompt', sans-serif; background: #ffffff; box-sizing: border-box;}
        .form-group input:focus, .form-group textarea:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15); }
        .readonly-field { background-color: #f8fafc !important; color: #64748b; border-style: dashed !important; }
    </style>
</head>
<body>

    <div class="standalone-form-container">
        <div style="margin-bottom: 15px;">
            <button type="button" onclick="window.history.back()" style="background: #f8fafc; border: 1px solid #cbd5e1; color: #475569; padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; font-family: 'Prompt', sans-serif;">
                ❮ ย้อนกลับ
            </button>
        </div>

        <div class="form-header-title">บันทึกการทำความสะอาดยานพาหนะ</div>
        
        <form id="cleanForm">
            <input type="hidden" name="sheet_name" value="การทำความสะอาดยานพาหนะ">
            <input type="hidden" name="Data_category" value="Cleaning">
            <input type="hidden" name="รุ่นรถ" id="cl_model">
            
            <div class="form-group">
                <label>รหัส/ทะเบียนรถ:</label>
                <input type="text" id="cl_plate" name="ทะเบียน" class="readonly-field" readonly>
            </div>
            <div class="form-group">
                <label>หมายเลขครุภัณฑ์:</label>
                <input type="text" id="cl_equip" name="หมายเลขครุภัณฑ์" class="readonly-field" readonly>
            </div>
            <div class="form-group">
                <label>วันที่ทำความสะอาด: <span style="color:red">*</span></label>
                <input type="date" name="วันที่" id="cl_date" required>
            </div>
            <div class="form-group">
                <label>ผู้ดำเนินการล้างรถ: <span style="color:red">*</span></label>
                <input type="text" name="ผู้ดำเนินการ" placeholder="ระบุชื่อผู้รับผิดชอบ" required>
            </div>
            <div class="form-group">
                <label>แนบรูปถ่าย (สูงสุด 5 รูป):</label>
                <input type="file" name="img1" accept="image/*" style="margin-bottom: 10px; border: 1px solid #ddd; padding: 5px; width: 100%; border-radius: 8px;">
                <input type="file" name="img2" accept="image/*" style="margin-bottom: 10px; border: 1px solid #ddd; padding: 5px; width: 100%; border-radius: 8px;">
                <input type="file" name="img3" accept="image/*" style="margin-bottom: 10px; border: 1px solid #ddd; padding: 5px; width: 100%; border-radius: 8px;">
                <input type="file" name="img4" accept="image/*" style="margin-bottom: 10px; border: 1px solid #ddd; padding: 5px; width: 100%; border-radius: 8px;">
                <input type="file" name="img5" accept="image/*" style="border: 1px solid #ddd; padding: 5px; width: 100%; border-radius: 8px;">
            </div>
            <div class="form-group">
                <label>หมายเหตุ (ถ้ามี):</label>
                <textarea name="หมายเหตุ" rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม..."></textarea>
            </div>
            <button type="submit" id="submitBtn" style="width: 100%; padding: 16px; background-color: #0ea5e9; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);">
                บันทึกข้อมูลการทำความสะอาด
            </button>
        </form>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbzWc03wzCkfUHs3pIucqNs_tz7BguxUlODGOihfiMgHgkQFx5Kc1DRlITg_SDR9lu4/exec";

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            document.getElementById('cl_model').value = urlParams.get('model') || '-';
            document.getElementById('cl_plate').value = urlParams.get('plate') || '-';
            document.getElementById('cl_equip').value = urlParams.get('equip') || '-';
            
            const now = new Date();
            const localDate = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().split('T')[0];
            document.getElementById('cl_date').value = localDate;
        };

        const compressImage = (file, maxWidth = 1024, maxHeight = 1024, quality = 0.7) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > maxWidth) { height = Math.round((height *= maxWidth / width)); width = maxWidth; } } 
                        else { if (height > maxHeight) { width = Math.round((width *= maxHeight / height)); height = maxHeight; } }
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        };

        document.getElementById('cleanForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const form = document.getElementById('cleanForm');
            const formDataToUpload = new FormData(form);
            const filesToProcess = [];

            for (let i = 1; i <= 5; i++) {
                const fileInput = form.querySelector(`input[name="img${i}"]`);
                if (fileInput && fileInput.files.length > 0) { 
                    filesToProcess.push({ index: i, file: fileInput.files[0] });
                }
            }

            Swal.fire({ 
                title: 'ส่งสำเร็จ', 
                icon: 'success', 
                timer: 1500, 
                showConfirmButton: false,
                backdrop: `rgba(15, 23, 42, 0.5)`,
                customClass: { popup: 'custom-swal-popup', title: 'custom-swal-title' }
            }).then(() => {
                window.history.back();
            });

            (async () => {
                try {
                    for (const item of filesToProcess) {
                        const base64 = await compressImage(item.file, 1024, 1024, 0.7); 
                        formDataToUpload.append(`imageB64_${item.index}`, base64.split(',')[1]); 
                        formDataToUpload.append(`imageMime_${item.index}`, 'image/jpeg'); 
                        formDataToUpload.append(`imageName_${item.index}`, item.file.name); 
                    }
                    await fetch(scriptURL, { method: 'POST', body: formDataToUpload, keepalive: true });
                } catch (err) {
                    console.error("Upload Failed: ", err);
                }
            })();
        });
    </script>
</body>
</html>
