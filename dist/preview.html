<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ระบบงานจราจรและความปลอดภัย มหาวิทยาลัยมหิดล</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2a5b; --navy-2:#123a78; --gold:#f2b705; --bg:#f3f5f9; --card:#fff; --ink:#152033; --muted:#5d6879; --line:#e1e6ee;
  --ok:#0f7a4b; --ok-bg:#e3f4ec; --warn:#9a5b00; --warn-bg:#fdf0d5; --bad:#a3271f; --bad-bg:#fbe6e4; --info:#1d4f91; --info-bg:#e7effb; --mute-bg:#eef1f5;
  --c1:#1d4f91; --c2:#d9822b; --c3:#2a9d8f; --c4:#8e6bbf; --c5:#7c8797; --fine:#b4432f;
  --r:14px; --sbw:264px; --sbw-mini:72px; --shadow:0 1px 2px rgba(16,32,64,.05),0 6px 18px rgba(16,32,64,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI","Thonburi",Tahoma,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p{margin:0}
a{color:var(--info)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:90}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sb{position:sticky;top:0;height:100vh;width:var(--sbw);flex:none;background:linear-gradient(180deg,var(--navy),#0a2350);color:#dbe5f7;display:flex;flex-direction:column;transition:width .2s ease;z-index:40}
.sb-brand{display:flex;gap:12px;align-items:center;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo{flex:none;width:40px;height:40px;border-radius:11px;background:var(--gold);color:var(--navy);font-weight:700;display:grid;place-items:center}
.sb-name{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.sb-name strong{color:#fff;font-size:.98rem}.sb-name span{font-size:.78rem;opacity:.75}
.sb-nav{flex:1;overflow-y:auto;padding:10px 8px;scrollbar-width:thin}
.sb-nav ul{list-style:none;margin:0;padding:0}
.nav-a,.nav-g{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:10px;color:#dbe5f7;text-decoration:none;font:inherit;font-size:.94rem;background:none;border:0;cursor:pointer;text-align:left;line-height:1.3}
.nav-a:hover,.nav-g:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-a[aria-current="page"]{background:#fff;color:var(--navy);font-weight:600}
.nav-g.has-active{color:#fff;font-weight:600}
.nav-g .chev{margin-left:auto;transition:transform .2s}
.nav-g[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sub{margin:2px 0 6px 22px!important;border-left:1px solid rgba(255,255,255,.18);padding-left:8px!important}
.sub .nav-a{font-size:.88rem;padding:7px 10px}
.nav-lbl{min-width:0}
.sb-foot{padding:12px 16px;font-size:.76rem;opacity:.7;border-top:1px solid rgba(255,255,255,.1)}
.app.mini .sb{width:var(--sbw-mini)}
.app.mini .sb-name,.app.mini .nav-lbl,.app.mini .chev,.app.mini .sub,.app.mini .sb-foot{display:none}
.app.mini .nav-a,.app.mini .nav-g{justify-content:center;padding:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;gap:12px;align-items:center;padding:10px 20px;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.icon-btn{flex:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--navy);display:grid;place-items:center;cursor:pointer}
.tb-title{display:flex;flex-direction:column;min-width:0;flex:1}
.tb-sys{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-page{font-size:1.05rem;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp{flex:none;font-size:.8rem;color:var(--muted);text-align:right;line-height:1.35}
.stamp b{color:var(--ink);font-weight:600}
.view{padding:20px 24px 40px;max-width:1280px;width:100%;outline:none}
.foot{margin-top:auto;padding:14px 24px;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);background:#fff}
.banner{margin:12px 24px 0;padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn);border:1px solid #f1d59a;font-size:.92rem}
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:35}

/* ---------- page head / controls ---------- */
.ph{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.ph h1{font-size:clamp(1.25rem,2.4vw,1.6rem);color:var(--navy);line-height:1.3}
.ph p{color:var(--muted);font-size:.93rem;margin-top:2px;max-width:760px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.9rem}
.ctrls label{font-weight:600}
select{font:inherit;font-size:.92rem;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.btn-ghost{font:inherit;font-size:.9rem;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.seg{display:inline-flex;background:var(--mute-bg);border-radius:11px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:.92rem;border:0;background:none;border-radius:9px;padding:7px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sec{margin-top:24px}
.sec-h{display:flex;gap:6px 12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-size:1.08rem;color:var(--navy)}
.sec-h .note{color:var(--muted);font-size:.85rem}
.sec-h .more{margin-left:auto;font-size:.88rem;font-weight:600;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.divider{display:flex;align-items:center;gap:12px;margin:34px 0 4px;color:var(--fine);font-weight:700;font-size:1.05rem}
.divider::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,#efc7bf,transparent)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{padding:14px 16px 12px 18px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--accent,var(--c1))}
.kpi-top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.88rem;font-weight:600}
.kpi-top .ic{color:var(--accent,var(--c1))}
.kpi-num{font-size:1.95rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--navy);letter-spacing:-.01em}
.kpi-num small{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:5px;letter-spacing:0}
.kpi-na{font-size:1rem;font-weight:700;color:var(--bad);padding:6px 0}
.kpi-sub{font-size:.88rem;color:var(--ink)}
.kpi-meta{margin-top:auto;padding-top:8px;font-size:.75rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:flex-end;justify-content:space-between}
.kpi-meta a{flex:none;font-weight:600;font-size:.8rem;text-decoration:none;white-space:nowrap}
.tag{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--mute-bg);color:var(--muted)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.ok{background:var(--ok-bg);color:var(--ok)}

/* ---------- charts ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.grid2>.kpis{align-content:start}
.chart{margin:0;padding:14px 16px;min-width:0}
.chart figcaption{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.chart figcaption strong{font-size:.98rem}
.chart figcaption span{font-size:.78rem;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{padding:24px 10px;text-align:center;color:var(--muted);font-size:.92rem}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.tbl th{position:sticky;top:0;background:#f2f5fa;font-weight:600;color:var(--ink)}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.sel td{background:var(--info-bg)}
.tbl tfoot td{font-weight:700;background:#fafbfd}

/* ---------- notes / details ---------- */
.notes{margin:0;padding-left:18px;font-size:.84rem;color:var(--muted)}
.notes li{margin:3px 0}
.notes.warn{color:var(--warn)}
.box{padding:14px 16px}
.box h3{font-size:.98rem;color:var(--navy);margin-bottom:6px}
details.box summary{cursor:pointer;font-weight:600;color:var(--navy)}
details.box[open] summary{margin-bottom:8px}
.def{font-size:.84rem;color:var(--ink);background:#f7f9fc;border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.src{font-size:.8rem;color:var(--muted);margin-top:6px}

/* ---------- system cards ---------- */
.sys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.sys{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sys h3{font-size:1rem;line-height:1.35}
.sys-desc{font-size:.88rem;color:var(--muted)}
.pill{align-self:flex-start;font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--mute-bg);color:var(--muted)}
.pill.s-connected{background:var(--ok-bg);color:var(--ok)}
.pill.s-warn,.pill.s-partial{background:var(--warn-bg);color:var(--warn)}
.pill.s-blocked,.pill.s-unverified{background:var(--bad-bg);color:var(--bad)}
.pill.s-link{background:var(--info-bg);color:var(--info)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.88rem;font-weight:600;text-decoration:none;background:var(--navy);color:#fff;border-radius:9px;padding:7px 12px;border:1px solid var(--navy);cursor:pointer}
.btn.sec{background:#fff;color:var(--navy)}
.btn small{font-weight:400;opacity:.8}

/* ---------- status strip ---------- */
.status-strip{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;font-size:.88rem}
.status-strip b{font-variant-numeric:tabular-nums}

/* ---------- map ---------- */
.mapcard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);overflow:hidden}
.map-left{padding:14px 16px;border-right:1px solid var(--line)}
.map-right{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.map-tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font:inherit;font-size:.86rem;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.map-svg svg{width:100%;height:auto;display:block;background:#f7f9fc;border:1px solid var(--line);border-radius:10px}
.map-svg circle{cursor:pointer;stroke:#fff;stroke-width:1.5}
.map-svg circle.sel{stroke:var(--ink);stroke-width:3}
.map-cap{font-size:.78rem;color:var(--muted);margin-top:6px}
.map-detail{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;background:#fafbfd}
.map-detail .btn{margin-top:8px}
.map-embed iframe{width:100%;height:220px;border:1px solid var(--line);border-radius:10px}
.map-list-wrap{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.linkish{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .sb{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 30px rgba(0,0,0,.25)}
  .app.open .sb{transform:none}
  .app.mini .sb{width:var(--sbw)}
  .app.mini .sb-name,.app.mini .nav-lbl,.app.mini .chev,.app.mini .sb-foot{display:revert}
  .app.mini .sub{display:block}
  .app.mini .nav-a,.app.mini .nav-g{justify-content:flex-start;padding:9px 12px}
  .view{padding:16px 14px 32px}
  .topbar{padding:8px 12px}
  .banner{margin:10px 14px 0}
  .stamp{display:none}
  .mapcard{grid-template-columns:1fr}
  .map-left{border-right:0;border-bottom:1px solid var(--line)}
  .map-list-wrap{max-height:260px}
}
@media (max-width:520px){
  .kpi-num{font-size:1.7rem}
  .grid2{grid-template-columns:1fr}
  .chart{padding:12px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sb,.nav-g .chev{transition:none}}
/* แถบสีของ Sidebar ยาวตลอดหน้า (เมื่อเนื้อหายาวกว่าหน้าจอ) */
@media (min-width:981px){.app{background:linear-gradient(90deg,#0a2350 0 var(--sbw),transparent var(--sbw))}.app.mini{background:linear-gradient(90deg,#0a2350 0 var(--sbw-mini),transparent var(--sbw-mini))}}

</style>
</head>
<body>
<a class="skip" href="#view">ข้ามไปยังเนื้อหา</a>
<div class="app" id="app">
  <aside class="sb" id="sidebar" aria-label="เมนูหลัก">
    <div class="sb-brand">
      <div class="sb-logo" aria-hidden="true">MU</div>
      <div class="sb-name"><strong>งานจราจรและความปลอดภัย</strong><span>มหาวิทยาลัยมหิดล ศาลายา</span></div>
    </div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot" id="sbFoot">รุ่นทดลอง (Preview)</div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn" id="navToggle" aria-controls="sidebar" aria-expanded="false" aria-label="เปิด/ปิดเมนู"></button>
      <div class="tb-title">
        <span class="tb-sys">ระบบงานจราจรและความปลอดภัย มหาวิทยาลัยมหิดล</span>
        <span class="tb-page" id="crumb"></span>
      </div>
      <div class="stamp" id="stamp" role="status">กำลังโหลดข้อมูล…</div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>
    <footer class="foot">หน้ารวมรุ่นทดลอง — ยังไม่ได้เผยแพร่ใช้งานจริง · แสดงเฉพาะสถิติรวม ไม่มีข้อมูลรายบุคคล · ระบบต้นทางทุกระบบยังทำงานตามเดิม</footer>
  </div>
</div>
<script>
/* config.js — ค่าตั้งค่าหน้ารวม (ไฟล์นี้เป็นสาธารณะ: ห้ามใส่รหัสผ่าน / Token / ข้อมูลลับ)
 *
 * statsApiUrl
 *   เว้นว่าง ""  = อ่านสถิติจากไฟล์ data/stats.json (ภาพข้อมูล ณ เวลาที่ระบุในไฟล์)
 *   ใส่ URL /exec ของ Apps Script "Hub Stats API" (apps-script/HubStats.gs) = อ่านสถิติรวมแบบสด
 *   Stats API ส่งกลับเฉพาะยอดรวม ไม่มีชื่อ เบอร์โทร ทะเบียนรถ
 *
 * googleMapsApiKey
 *   เว้นว่าง ""  = ใช้แผนผังในหน้า + ลิงก์เปิด Google Maps (ไม่ต้องมี key)
 *   ถ้าจะใช้ Google Maps JavaScript API ให้ใส่ "Browser key" ที่จำกัดสิทธิ์แล้วเท่านั้น
 *   (HTTP referrer = โดเมนของหน้านี้, API = Maps JavaScript API) — key ชนิดนี้มองเห็นได้จากเบราว์เซอร์เสมอ
 *   จึงต้องจำกัดสิทธิ์ที่ Google Cloud Console ก่อนใส่ทุกครั้ง
 */
window.HUB_CONFIG = {
  statsApiUrl: "",
  googleMapsApiKey: "",
  allowMapEmbed: true

    tools.textContent = ''; box.textContent = ''; list.textContent = '';
    if (!am) { box.appendChild(el('div', { class: 'empty', text: 'ยังเชื่อมต่อข้อมูลพิกัดไม่ได้' })); return; }
    [['all', 'ทุกประเภท'], [V, 'ยานพาหนะ'], [G, 'ทั่วไป']].forEach(function (o) { tools.appendChild(el('button', { type: 'button', class: 'chip', 'aria-pressed': String(state.mapType === o[0]), text: o[1], onclick: function () { state.mapType = o[0]; state.sel = -1; renderMap(); } })); });
    var pts = mapPoints(), b = am.box, W = 500, H = 640, pad = 18;
    var px = function (lng) { return pad + (W - 2 * pad) * (lng - b.lngMin) / (b.lngMax - b.lngMin); }, py = function (lat) { return pad + (H - 2 * pad) * (b.latMax - lat) / (b.latMax - b.latMin); };
    var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H }), i;
    for (i = 0; i <= 4; i++) { root.appendChild(svg('line', { x1: pad + (W - 2 * pad) * i / 4, x2: pad + (W - 2 * pad) * i / 4, y1: pad, y2: H - pad, stroke: '#e1e6ee' })); root.appendChild(svg('line', { y1: pad + (H - 2 * pad) * i / 4, y2: pad + (H - 2 * pad) * i / 4, x1: pad, x2: W - pad, stroke: '#e1e6ee' })); }
    var sb = (W - 2 * pad) * (500 / (111320 * Math.cos(13.795 * Math.PI / 180))) / (b.lngMax - b.lngMin);
    root.appendChild(svg('line', { x1: pad + 6, x2: pad + 6 + sb, y1: H - pad - 8, y2: H - pad - 8, stroke: '#152033', 'stroke-width': 2 }));
    root.appendChild(svg('text', { x: pad + 6, y: H - pad - 14, 'font-size': 11, fill: '#152033', text: '500 ม.' }));
    root.appendChild(svg('text', { x: W - pad - 6, y: pad + 16, 'font-size': 12, 'text-anchor': 'end', fill: '#152033', 'font-weight': 600, text: 'N ↑' }));
    pts.filter(function (p) { return !p.outOfCampusBox; }).forEach(function (p) {
      var c = svg('circle', { cx: px(p.lng), cy: py(p.lat), r: 7, fill: p.type === V ? C.c1 : C.c2, 'fill-opacity': .85, tabindex: 0, role: 'button', 'aria-label': p.type + ' ' + p.place + ' ' + mLabel(p.month), class: p.i === state.sel ? 'sel' : '',
        onclick: function () { state.sel = p.i; renderMap(); }, onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); state.sel = p.i; renderMap(); } } });
      c.appendChild(svg('title', { text: p.type + ' · ' + p.place + ' · ' + mLabel(p.month) })); root.appendChild(c);
    });
    if (useGoogleMap()) renderGoogleMap(box, pts, b); else box.appendChild(root);
    box.appendChild(el('div', { class: 'legend' }, [el('span', {}, [el('i', { style: 'background:' + C.c1 }), V]), el('span', {}, [el('i', { style: 'background:' + C.c2 }), G])]));
    var note = $('mapNote'); if (note) note.textContent = num(pts.length) + ' จุดในช่วง ' + rangeText() + ' · ที่มา: รายงานเหตุการณ์ คอลัมน์ “พิกัด (Lat, Lng)” · อัปเดต ' + dLabel(am.updated);
    var det = $('mapDetail'), sel = am.points[state.sel], emb = $('mapEmbed'); det.textContent = ''; emb.textContent = ''; emb.hidden = true;
    if (sel && pts.indexOf(sel) >= 0) {
      det.appendChild(el('div', {}, [el('strong', { text: sel.place })]));
      det.appendChild(el('div', { text: sel.type + ' · ' + mFull(sel.month) + ' · พิกัด ' + sel.lat.toFixed(6) + ', ' + sel.lng.toFixed(6) + (sel.outOfCampusBox ? ' (อยู่นอกกรอบวิทยาเขต ควรตรวจสอบ)' : '') }));
      det.appendChild(el('a', { class: 'btn', href: mapsUrl(sel), target: '_blank', rel: 'noopener' }, ['เปิดตำแหน่งนี้ใน Google Maps', ic('ext', 15)]));
      if (CFG.allowMapEmbed && !window.__HUB_PREVIEW__) { emb.hidden = false; emb.appendChild(el('iframe', { title: 'Google Maps: ' + sel.place, loading: 'lazy', referrerpolicy: 'no-referrer', src: 'https://www.google.com/maps?q=' + sel.lat + ',' + sel.lng + '&z=17&output=embed' })); }
    } else det.appendChild(el('div', { text: 'เลือกจุดบนแผนผังหรือในตาราง เพื่อดูตำแหน่งและเปิดใน Google Maps' }));
    list.appendChild(el('thead', {}, [el('tr', {}, [el('th', { text: 'เดือน' }), el('th', { text: 'ประเภท / สถานที่' }), el('th', { text: 'แผนที่' })])]));
    var tb = el('tbody');
    pts.slice().sort(function (a, c) { return a.month < c.month ? 1 : a.month > c.month ? -1 : 0; }).forEach(function (p) {
      tb.appendChild(el('tr', { class: p.i === state.sel ? 'sel' : '' }, [el('td', { text: mLabel(p.month) }),
        el('td', {}, [el('span', { class: 'dot', style: 'background:' + (p.type === V ? C.c1 : C.c2) }), el('button', { type: 'button', class: 'linkish', text: p.place + (p.outOfCampusBox ? ' (นอกกรอบ)' : ''), onclick: function () { state.sel = p.i; renderMap(); } })]),
        el('td', {}, [el('a', { href: mapsUrl(p), target: '_blank', rel: 'noopener', text: 'เปิด' })])]));
    });
    if (!pts.length) tb.appendChild(el('tr', {}, [el('td', { colspan: 3, class: 'empty', text: 'ไม่มีจุดในช่วงที่เลือก' })]));
    list.appendChild(tb);
  }

  /* ---------- เริ่มทำงาน ---------- */
  function renderStamp() {
    var g = DATA.stats.generatedAt || '', s = $('stamp'); s.textContent = '';
    s.appendChild(el('b', { text: 'ข้อมูล ณ ' + dLabel(g.slice(0, 10) + ' ' + g.slice(11, 16)) })); s.appendChild(el('br'));
    s.appendChild(document.createTextNode(liveMode ? 'อ่านสดจาก Stats API (ยอดรวม)' : 'ไฟล์สถิติรวม · เวลาไทย'));
  }
  function collectMonths() {
    var set = {}; ['incidents', 'gate', 'lostfound', 'cctv'].forEach(function (k) { ((mod(k) || {}).monthly || []).forEach(function (r) { set[r.month] = 1; }); });
    MONTHS = Object.keys(set).sort(); state.from = MONTHS[0]; state.to = MONTHS[MONTHS.length - 1];
  }
  setupShell();
  load().then(function (d) {
    DATA = d; DATA.systems.categories.forEach(function (c) { c.systems.forEach(function (s) { SYS[s.id] = s; }); });
    collectMonths(); renderStamp(); route(true);
    window.addEventListener('hashchange', function () { route(false); });
  }).catch(function (e) {
    $('stamp').textContent = 'โหลดข้อมูลไม่สำเร็จ';
    showBanner('ยังเชื่อมต่อไฟล์สถิติรวมไม่ได้: ' + e.message + ' — หน้านี้จะไม่แสดงตัวเลขใด ๆ จนกว่าจะโหลดข้อมูลจริงได้');
  });
})();
